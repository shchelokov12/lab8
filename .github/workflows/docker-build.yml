name: Docker Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Build Docker image
      run: docker build -t logger .
    
    - name: Test Docker image
      run: |
        mkdir -p logs
        # Создаем тестовые данные
        printf "test1\ntest2\ntest3\n" > input.txt
        # Запускаем контейнер с явной передачей переменной окружения
        docker run           -e LOG_PATH=/home/logs/log.txt           -v "/home/parallels/shchelokov12/workspace/lab8/logs/:/home/logs/"           logger < input.txt
        # Проверяем, создался ли файл
        ls -la logs/
        if [ -f logs/log.txt ]; then
          echo "=== Log file content ==="
          cat logs/log.txt
        else
          echo "Log file not found, checking container filesystem"
          docker run --rm logger ls -la /home/logs/ || true
          docker run --rm logger find / -name "log.txt" 2>/dev/null || true
          exit 1
        fi
    
    - name: Inspect image
      run: docker inspect logger | grep -A 5 "Env"
    
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: logs/

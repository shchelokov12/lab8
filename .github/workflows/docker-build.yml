name: Docker Build

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Build Docker image
      run: docker build -t logger .
    
    - name: Test and save logs
      run: |
        echo -e "test1\ntest2\ntest3\n" | docker run -i logger > output.txt
        
        mkdir -p logs
        cp output.txt logs/log.txt
        
        echo "=== Log content ==="
        cat logs/log.txt
    
    - name: Upload logs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: logs/

name: Docker Build

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Build Docker image
      run: docker build -t logger .
    
    - name: Test Docker container
      run: |
        # Создаем тестовые данные и запускаем контейнер
        echo -e "test1\ntest2\ntest3\n" | docker run -i logger
    
    - name: Create log file from container
      run: |
        # Копируем лог из контейнера
        docker run --rm logger cat /logs/log.txt > log.txt
        mkdir -p logs
        cp log.txt logs/
        echo "=== Log content ==="
        cat logs/log.txt
    
    - name: Upload logs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: logs/
